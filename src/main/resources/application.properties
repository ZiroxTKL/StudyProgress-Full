spring.application.name=StudyProgress
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studyprogress}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Lima
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
resend.api-key=${RESEND_API_KEY:re_disabled}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.email-enabled=${EMAIL_ENABLED:false}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.cookie-secure=${COOKIE_SECURE:true}
