# Standalone production configuration: docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?required}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_disabled}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      TZ: America/Lima
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
volumes:
  caddy_data:
  caddy_config:
